services:
  postgres:
    image: postgres:16-alpine
    container_name: financial-transfer-db
    environment:
      POSTGRES_DB: ${DB_NAME:-financial_transfer}
      POSTGRES_USER: ${DB_USER:-transfer_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-transfer_pass}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-transfer_user} -d ${DB_NAME:-financial_transfer}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: financial-transfer-app
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-financial_transfer}
      DB_USER: ${DB_USER:-transfer_user}
      DB_PASSWORD: ${DB_PASSWORD:-transfer_pass}
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  app2:
    build: .
    container_name: financial-transfer-app2
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-financial_transfer}
      DB_USER: ${DB_USER:-transfer_user}
      DB_PASSWORD: ${DB_PASSWORD:-transfer_pass}
      SERVER_PORT: 8080
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: